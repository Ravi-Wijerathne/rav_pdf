name: Multi-Platform Release & SLSA Provenance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: ""

jobs:
  build-matrix:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64 (NFR-06.1)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            archive: zip
            binary_ext: .exe
          # Linux x86_64 (NFR-06.1)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            archive: tar.gz
            binary_ext: ""
          # macOS Intel x86_64 (NFR-06.1)
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x86_64
            archive: tar.gz
            binary_ext: ""
          # macOS Apple Silicon ARM64 (NFR-06.1)
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
            archive: tar.gz
            binary_ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libfontconfig1-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binaries (CLI & GUI)
        run: cargo build --release --target ${{ matrix.target }} -p ravpdf-cli -p ravpdf-gui

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/ravpdf.exe" staging/
          cp "target/${{ matrix.target }}/release/ravpdf-gui.exe" staging/
          cp README.md staging/
          TAG="${{ inputs.tag_name || github.ref_name }}"
          PKG_NAME="ravpdf-${TAG}-${{ matrix.name }}.zip"
          7z a "${PKG_NAME}" ./staging/*
          sha256sum "${PKG_NAME}" > "${PKG_NAME}.sha256"

      - name: Package Artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/ravpdf" staging/
          cp "target/${{ matrix.target }}/release/ravpdf-gui" staging/
          cp README.md staging/
          TAG="${{ inputs.tag_name || github.ref_name }}"
          PKG_NAME="ravpdf-${TAG}-${{ matrix.name }}.tar.gz"
          tar -czvf "${PKG_NAME}" -C staging .
          sha256sum "${PKG_NAME}" > "${PKG_NAME}.sha256"

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            ravpdf-*.zip
            ravpdf-*.tar.gz
            ravpdf-*.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      release_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Determine Release Tag
        id: vars
        shell: bash
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Compute consolidated checksums and SLSA subjects
        id: hash
        shell: bash
        run: |
          cd dist
          ls -la
          sha256sum ravpdf-*.zip ravpdf-*.tar.gz > checksums.sha256
          cat checksums.sha256
          echo "hashes=$(sha256sum ravpdf-*.zip ravpdf-*.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ravpdf-*.zip
            dist/ravpdf-*.tar.gz
            dist/checksums.sha256
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Release ${{ steps.vars.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false

  provenance:
    name: Generate SLSA Level 3 Provenance (OpenSSF)
    needs: [publish-release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.publish-release.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: "${{ needs.publish-release.outputs.release_tag }}"
      private-repository: true

