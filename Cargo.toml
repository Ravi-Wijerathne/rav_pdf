[workspace]
members = [
    "crates/ravpdf-core",
    "crates/ravpdf-render",
    "crates/ravpdf-edit",
    "crates/ravpdf-annot",
    "crates/ravpdf-forms",
    "crates/ravpdf-crypto",
    "crates/ravpdf-tools",
    "crates/ravpdf-cli",
    "crates/ravpdf-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RavPDF Development Team"]
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
# Internal workspace crates
ravpdf-core = { path = "crates/ravpdf-core" }
ravpdf-render = { path = "crates/ravpdf-render" }
ravpdf-edit = { path = "crates/ravpdf-edit" }
ravpdf-annot = { path = "crates/ravpdf-annot" }
ravpdf-forms = { path = "crates/ravpdf-forms" }
ravpdf-crypto = { path = "crates/ravpdf-crypto" }
ravpdf-tools = { path = "crates/ravpdf-tools" }

# Common dependencies
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
tiny-skia = "0.11"
clap = { version = "4.5", features = ["derive", "cargo"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp", "gif"] }
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
sha2 = { version = "0.10", features = ["oid"] }
md-5 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
fax = "0.3"
pdfluent-jbig2 = "0.3"
boa_engine = "0.19"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.37", features = ["serialize"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui-phosphor = "0.7"
