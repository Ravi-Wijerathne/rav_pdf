<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Main Fold / Ribbon Gradient (R stem & curve) -->
    <linearGradient id="mainBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Top Fold Gradient -->
    <linearGradient id="topFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Dynamic Diagonal Leg Gradient -->
    <linearGradient id="accentLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Document Page Backing Gradient -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#dropShadow)"/>

  <!-- Subtle Background Grid/Sheet Glow -->
  <rect x="96" y="88" width="320" height="336" rx="24" fill="url(#sheetGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Document Grid Lines (Symbolizing PDF vector/text fidelity) -->
  <line x1="140" y1="144" x2="250" y2="144" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="172" x2="220" y2="172" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="200" x2="200" y2="200" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round"/>

  <!-- Dynamic Stylized 'R' Origami Fold / PDF Motif -->
  <g filter="url(#dropShadow)">
    <!-- Vertical Spine (Document Spine / Stem of 'R') -->
    <path d="M 160 112 
             C 146.7 112 136 122.7 136 136 
             L 136 376 
             C 136 389.3 146.7 400 160 400 
             L 192 400 
             C 205.3 400 216 389.3 216 376 
             L 216 136 
             C 216 122.7 205.3 112 192 112 
             Z" 
          fill="url(#mainBlue)"/>

    <!-- Upper Loop of the 'R' (Folded Document Page) -->
    <path d="M 192 112 
             L 288 112 
             C 336 112 372 144 372 192 
             C 372 240 336 272 288 272 
             L 192 272 
             Z" 
          fill="url(#topFold)"/>
    
    <!-- Inner Cutout of Upper Loop -->
    <path d="M 216 168 
             L 280 168 
             C 298 168 312 178 312 192 
             C 312 206 298 216 280 216 
             L 216 216 
             Z" 
          fill="#0F172A" 
          opacity="0.85"/>

    <!-- Diagonal Dynamic Leg of 'R' (Folded Forward Layer) -->
    <path d="M 264 252 
             L 348 382 
             C 354 391 364 398 376 398 
             L 396 398 
             C 408 398 414 384 406 374 
             L 326 252 
             Z" 
          fill="url(#accentLeg)"/>

    <!-- Fold Crease Highlight Line -->
    <path d="M 192 272 L 288 272" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Rust Precision Accent Mark (Small Orange/Coral Gem on upper corner) -->
  <circle cx="360" cy="132" r="10" fill="#F97316" filter="url(#glow)"/>
</svg>
